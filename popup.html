<!DOCTYPE html>
<html>
  <head>
    <style>
      body { width: 250px; padding: 15px; font-family: Arial, sans-serif; }
      input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
      button { width: 100%; padding: 8px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px;}
      button:hover { background: #0056b3; }
      #result { margin-top: 15px; font-weight: bold; font-size: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <h3>Acronym Lookup</h3>
    <input type="text" id="searchInput" placeholder="Enter an acronym/term (e.g., BEE)">
    <button id="searchBtn">Search</button>
    <div id="result"></div>

    <script src="popup.js"></script>
  </body>
</html>
